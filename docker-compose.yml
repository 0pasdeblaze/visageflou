services:
  visageflou:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-visageflou.fr}"
    read_only: true
    volumes:
      # keeps certificates across restarts (Let's Encrypt rate limits)
      - caddy_data:/data
    tmpfs:
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none

volumes:
  caddy_data:
