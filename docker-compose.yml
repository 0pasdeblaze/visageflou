services:
  deface-web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SITE_ADDRESS: ":8080"
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none
